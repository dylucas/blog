baseurl: https://blog.dylucas.cn/
locale: zh-CN
theme: hugo-theme-stack
pagination:
    pagerSize: 5
title: 雨夜无声

languages:
    # en:
    #     label: English
    #     title: rainy night silent
    #     description: My Notebook
    #     weight: 2
    #     # 英文版暂无文章，移除会渲染为空的 categories / tag-cloud 组件
    #     params:
    #         widgets:
    #             homepage:
    #                 - type: search
    #                 - type: archives
    #                   params:
    #                       limit: 5
    zh:
        label: 中文
        title: 雨夜无声
        description: 我的笔记本
        weight: 1

# Change it to your Disqus shortname before using
# disqusShortname: hugo-theme-stack

# GA Tracking ID
googleAnalytics:

# Theme i18n support
# Available values: ar, bn, ca, de, el, en, es, fr, hu, id, it, ja, ko, nl, pt-br, th, uk, zh-cn, zh-hk, zh-tw
DefaultContentLanguage: zh

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage: true

permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    mainSections:
        - post
    # 文章列表排序方式：default 或 lastmod
    SortBy: default
    rssFullContent: true
    # favicon 放在 static/favicon.ico 下，此处以 `/` 开头
    favicon: /favicon.ico

    footer:
        since: 2017
        customText:

    dateFormat:
        published: Jan 02, 2006
        lastUpdated: Jan 02, 2006 15:04 MST

    sidebar:
        emoji: 🍥
        subtitle: 倒映在水盆中的月亮

    article:
        headingAnchor: false
        math: false
        toc: true
        readingTime: true
        list:
            # 列表页是否显示文章标签
            showTags: false
        license:
            enabled: true
            default: Licensed under CC BY-NC-SA 4.0

    comments:
        enabled: false
        provider: gitalk

        gitalk:
            owner:
            admin:
            repo:
            clientID:
            clientSecret:

    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 5
            - type: categories
              params:
                  limit: 10
            - type: tag-cloud
              params:
                  limit: 10
        page:
            - type: toc

    opengraph:
        twitter:
            # Your Twitter username
            site:

            # Available values: summary, summary_large_image
            card: summary_large_image

    colorScheme:
        # Display toggle
        toggle: true

        # Available values: auto, light, dark
        default: auto

    imageProcessing:
        # 根据照片 EXIF 信息自动旋转（竖拍照片建议开启）
        autoOrient: false
        external:
            timeout: 5s
        content:
            widths: [800, 1600, 2400]
            enabled: true
        thumbnail:
            enabled: true

### Custom menu
### To remove about, archive and search page menu item, remove `menu` field from their FrontMatter
menu:
    main: []

    social:
        - identifier: email
          name: Email
          url: mailto:dylucas@163.com
          params:
              icon: brand-mail

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100

        - name: categories
          weight: 200

markup:
    goldmark:
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: false
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4
